<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ STORE_NAME }} — {{ STORE_TAGLINE }}{% endblock %}</title>
  <meta name="description"
    content="{% block meta_description %}{{ STORE_NAME }} — {{ STORE_TAGLINE }}. Produtos selecionados com entrega para todo o Brasil.{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>

<body>
  {% include "partials/navbar.html" %}

  <main class="fade-up">
    <div class="container mt-3">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
      {% endwith %}
    </div>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    function ajustarNavbar() {
      const navTop = document.querySelector('.navbar-top');
      const navBottom = document.querySelector('.navbar-bottom');

      if (!navTop || !navBottom) return;

      const alturaTop = navTop.getBoundingClientRect().height;

      // Posiciona navbar-bottom logo abaixo da navbar-top
      navBottom.style.top = alturaTop + 'px';

      // Aguarda o reflow para medir a navbar-bottom já posicionada
      requestAnimationFrame(() => {
        const alturaBottom = navBottom.getBoundingClientRect().height;
        document.body.style.paddingTop = (alturaTop + alturaBottom) + 'px';
      });
    }

    window.addEventListener('load', ajustarNavbar);
    window.addEventListener('resize', ajustarNavbar);
  </script>

</body>

</html>
