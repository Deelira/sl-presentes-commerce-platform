{% extends "base.html" %}{% block title %}Nova senha{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:440px">
    <div class="card-neo p-4 p-md-5">
      <h1 class="h3">Definir nova senha</h1>
      <form method="post" class="mt-3">{{ form.hidden_tag() }}
        <label class="form-label">Nova senha</label>{{ form.password(class_='form-control mb-3') }}
        <label class="form-label">Confirmar</label>{{ form.confirm(class_='form-control mb-3') }}
        <button class="btn btn-neon w-100">Salvar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
