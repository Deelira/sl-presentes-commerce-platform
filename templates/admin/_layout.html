<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Admin — {{ STORE_NAME }}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand">{{ STORE_NAME }}</div>
      <a href="{{ url_for('admin.dashboard') }}"
        class="{% if request.endpoint=='admin.dashboard' %}active{% endif %}">📊 Dashboard</a>
      <a href="{{ url_for('admin.orders') }}" class="{% if 'order' in request.endpoint %}active{% endif %}">📦
        Pedidos</a>
      <a href="{{ url_for('admin.products') }}" class="{% if 'product' in request.endpoint %}active{% endif %}">🛍️
        Produtos</a>
      <a href="{{ url_for('admin.categories') }}" class="{% if 'categor' in request.endpoint %}active{% endif %}">🏷️
        Categorias</a>
      <a href="{{ url_for('admin.suppliers') }}" class="{% if 'supplier' in request.endpoint %}active{% endif %}">🚚
        Fornecedores</a>
      <a href="{{ url_for('admin.users') }}" class="{% if 'user' in request.endpoint %}active{% endif %}">👥
        Usuários</a>
      <hr>
      <a href="{{ url_for('shop.home') }}">↗ Ver loja</a>
      <a href="{{ url_for('auth.logout') }}">⎋ Sair</a>
    </aside>
    <main class="admin-main">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
